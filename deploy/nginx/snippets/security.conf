# Repeated in every location that adds its own headers (nginx drops inherited add_header otherwise).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(self), geolocation=(self), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Styles: React inline styles and Leaflet need 'unsafe-inline'. Fonts: Google Fonts. Images: OpenStreetMap tiles.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;  # browsers ignore it on plain HTTP
