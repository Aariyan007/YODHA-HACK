# Everything a server block serves: the SPA, the API proxy, rate limits. Included by the http and https servers.

location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }

# Hashed build assets never change: cache for a year.
location /assets/ {
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# The shell must always be fresh so a new deploy is picked up.
location = /index.html {
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "no-cache" always;
}

# Upload progress stream (SSE). No buffering, long timeout, so each stage reaches the browser as it happens.
location ^~ /api/jobs/ {
    limit_req zone=general burst=60 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    gzip off;
    add_header X-Accel-Buffering "no" always;
}

# Sign-in and sign-up: slow down password guessing before it reaches the app (the app also locks per email).
location ^~ /api/auth/ {
    limit_req zone=auth burst=5 nodelay;
    include /etc/nginx/snippets/proxy.conf;
}

# Uploads and hospital imports: a few per minute, size capped here as well as in the app.
location = /api/documents {
    limit_req zone=upload burst=5 nodelay;
    client_max_body_size 11m;
    include /etc/nginx/snippets/proxy.conf;
}
location = /api/import/fhir {
    limit_req zone=upload burst=5 nodelay;
    client_max_body_size 3m;
    include /etc/nginx/snippets/proxy.conf;
}

location /api/ {
    limit_req zone=general burst=60 nodelay;
    include /etc/nginx/snippets/proxy.conf;
}

location = /health { access_log off; include /etc/nginx/snippets/proxy.conf; }

# Single-page app: unknown paths fall back to index.html (React Router handles them).
location / {
    include /etc/nginx/snippets/security.conf;
    try_files $uri /index.html;
}
