worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;
    proxy_read_timeout 90s;   # the SSE location overrides this

    # Non-root nginx: every temp path lives in /tmp (a tmpfs in compose).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # JSON access log on stdout. Share tokens and job ids are redacted from the path; query strings are never logged.
    map $uri $log_path {
        ~^(?<p>/api/(?:shares|jobs)/)[^/]+(?<rest>.*)$  "${p}<redacted>${rest}";
        ~^(?<p2>/(?:console|share)/)[^/]+$              "${p2}<redacted>";
        default                                         $uri;
    }
    log_format json escape=json '{"t":"$time_iso8601","rid":"$request_id","ip":"$remote_addr","method":"$request_method","path":"$log_path","status":$status,"bytes":$body_bytes_sent,"ms":$request_time,"up_ms":"$upstream_response_time"}';
    access_log /dev/stdout json;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 1m;          # raised per location for uploads
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_zone  $binary_remote_addr zone=auth:10m    rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=upload:10m  rate=20r/m;
    limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn perip 40;

    # Load balancer over every API copy (docker compose runs several "backend" containers).
    # Docker's DNS is asked again every 5 s, so copies that are added, removed or restarted are picked up without
    # restarting nginx. least_conn sends each request to the copy with the fewest open requests, and a copy that
    # fails twice is skipped for 10 s.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream backend {
        zone backend 64k;
        least_conn;
        server backend:8000 resolve max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    # Internal listener for load tests only: same load balancing, no per-IP rate limits. Port 8081 is NOT published,
    # so only containers on the compose network can reach it (scripts/load_test.py run with BASE_URL=http://nginx:8081).
    server {
        listen 8081;
        server_name _;
        location = /nginx-health { access_log off; return 200 "ok\n"; }
        location /api/ { include /etc/nginx/snippets/proxy.conf; }
    }

    # Plain HTTP: serves the same app (handy on a LAN). Browser features like the microphone want HTTPS below.
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/app.conf;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;
        root /usr/share/nginx/html;

        ssl_certificate     /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        include /etc/nginx/snippets/app.conf;
    }
}
